[workspace]
members = [".", "crates/protocol", "crates/signaling"]
default-members = ["."]
resolver = "2"

[package]
name = "musictalk"
version = "0.1.0"
authors = ["ashu"]
edition = "2021"

[dependencies]
musictalk-protocol = { path = "crates/protocol" }
dioxus = { version = "=0.7.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
dotenvy = { version = "0.15", optional = true }

[build-dependencies]
cc = "1"

[features]
default = ["web"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dioxus/fullstack", "dep:axum", "dep:tokio", "dep:futures-util", "dep:uuid", "dep:dotenvy"]
